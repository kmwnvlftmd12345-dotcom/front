<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action="">
        화면에 보이지는 않지만 숨겨진 필드가 있다
        (주로 서버에 값을 전달 하거나 사용자의 상태를 체크하기 위해)
        <input type="hidden" name="">
        <hr>
        이메일 체크 기능이 추가<br>
        값이 입력 된 경우 @가 있는지 없는지 체크<br>
        required : 필수 입력 체크
        <input type="email" name="" id="" required>
        <hr>
        입력된 검색어를 한번에  지우는 기능
        <input type="search" name="search" id="">
        <hr>
        <input type="range" name="range" id="">
        <hr>
        숫자를 입력하고 조절하는 스핀버튼이 자동으로 생성 됨
        최대값, 최소값, 증감값을 지정
        <input type="number" name="number" id="" min="0" max="99" step="10">
        <hr>
        <input type="file">
        <hr>
        readonly  : 읽기전용 필드로 변경
        <input type="text" name="" id="" readonly value="readonly">
        <hr>
        <input type="submit" value="전송">

    </form> 
</body>
</html>
