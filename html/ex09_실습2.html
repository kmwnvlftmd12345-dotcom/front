<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* padding:40; 상하좌우 40 패딩 적용
           padding:20 40; 상하 20 좌우 40
           padding:10 20 30 40
        */
        body{border:1px solid black;padding:20px 40px;}
        p{padding-left: 40px;}
    </style>
</head>
<body>
    <h1>프론트엔드 개발자 지원서</h1>
    HTML, CSS, JavaScript에 대한 기술적 이해와 경험이 있는 분을 찾습니다.

    <hr>
    <form action="">
        <h3>개인정보</h3>
        <p>이름 <input type="text" name="name" id=""></p>
        <p>연락처 <input type="tel" name="phone" id=""></p>
        <h3>지원분야</h3>
        <p><input type="radio" name="type" id="" value="1">웹 퍼블리싱</p>
        <p><input type="radio" name="type" id="" value="2">웹 애플리케이션 개발</p>
        <p><input type="radio" name="type" id="" value="3">개발 환경 개선</p>
        <h3>지원동기</h3>
        <p><textarea name="ma" id="" cols="60" rows="6"
                placeholder="본사 지원 동기를 간략히 써 주세요."></textarea>

        <p>
            <input type="submit" value="접수하기">
            <input type="reset" value="초기화">
        </p>
    </form>
</body>
</html>
